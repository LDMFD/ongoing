version: '3'

services:
  react-dashboard-builder:
    container_name: ongoing-react-dashboard-builder
    build:
      context: ./Dashboard
      dockerfile: Builder.Dockerfile
    volumes:
      - "./Dashboard/build:/app/build"

  dashboard-server:
    container_name: ongoing-dashboard
    build:
      context: ./DashboardServer
      dockerfile: Dockerfile
    platform: linux/amd64
    ports:
      - "8080:8080"
    volumes:
      - ./DashboardServer/build:/app/build
      - ~/.ongoing/secrets/firebase-client-key.json:/app/Config/Firebase/key.json
