version: '3'

volumes:
  postgres:
  node_modules:

services:
  postgres:
    container_name: ongoing-db
    image: postgres:latest
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - "postgres:/var/lib/postgresql/data"
      #- ./postgres-init.sql:/docker-entrypoint-initdb.d/init.sql
    env_file:
      - .env

  dash:
    container_name: ongoing-dash
    build:
      context: ./Dashboard
      dockerfile: Dockerfile.dev
    volumes:
      - ./dashboard:/app
      - "node_modules:/app/node_modules"
    ports:
      - "3000:3000"

  api:
    container_name: ongoing-api
    image: ongoing-api
    build: ApiServer
    depends_on:
      - postgres
    volumes:
      - ./ApiServer/src:/go/src
      #- ./creds:/app/creds
    ports:
      - "8000:8000"
    env_file:
      - .env
