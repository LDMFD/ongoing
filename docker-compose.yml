version: '3'

volumes:
  postgres:
  node_modules:

services:
  postgres:
    container_name: ongoing-db
    image: postgres:14.2
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - "postgres:/var/lib/postgresql/data"
      - ./Postgres/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql
    env_file:
      - .env
  
  spicedb:
    container_name: spicedb
    image: authzed/spicedb:v1.12.0
    ports:
      - "50051:50051"
    environment:
      - ONGOING_SPICEDB_HOST=localhost:50051
      - ONGOING_SPICEDB_PSK=spice
      - SPICEDB_DATASTORE_ENGINE=postgres
      - SPICEDB_DATASTORE_CONN_URI=postgres://postgres:p@ongoing-db:5432/spicedb-local?sslmode=disable
      - SPICEDB_GRPC_PRESHARED_KEY=spice
    command: serve --log-level=debug

  dashboard:
    depends_on:
      - postgres
    container_name: ongoing-dash
    build:
      context: ./Dashboard
      dockerfile: Dockerfile
    volumes:
      - ./Dashboard:/app
      - "node_modules:/app/node_modules"
    ports:
      - "3000:3000"
    env_file:
      - .env

  api:
    container_name: ongoing-api
    image: ongoing-api
    build: ApiServer
    depends_on:
      - postgres
    volumes:
      - ./ApiServer/src:/go/src
    ports:
      - "8000:8000"
    env_file:
      - .env
    platform: linux/amd64

  api-test:
    container_name: ongoing-api-test
    image: ongoing-api-test
    build:
      context: ./ApiServer
      dockerfile: Tests.Dockerfile
    depends_on:
      - postgres
    volumes:
      - ./ApiServer/src:/go/src
    ports:
      - "8000:8000"
    env_file:
      - .env
    platform: linux/amd64
