schema: |-
  definition user {}

  definition organisation {
    relation owner: user
    relation administrator: user
    relation advisor: user
    relation client: user

    permission write = owner
    permission read = write + client
    permission report_editor = administrator + owner
  }

  definition client {
    relation org: organisation

    relation subject: user
    relation advisor: user

    permission write = advisor + org->report_editor
    permission read = write + subject
  }

relationships: |
  organisation:org1#owner@user:darren#...
  organisation:org1#administrator@user:paul#...
  organisation:org1#advisor@user:quentin#...
  organisation:org1#client@user:adam#...

  client:c1#subject@user:adam#...
  client:c1#advisor@user:quentin#...
  client:c1#org@organisation:org1#...

  client:c2#subject@user:bob#...
  client:c2#advisor@user:ray#...
  client:c2#org@organisation:org1#...

  client:c3#subject@user:charlie#...
  client:c3#advisor@user:paul#...
  client:c3#org@organisation:org1#...

  client:c4#subject@user:danny#...
  client:c4#advisor@user:darren#...
  client:c4#org@organisation:org1#...
  

  organisation:org2#owner@user:darren#...
  organisation:org2#administrator@user:sierra#...
  organisation:org2#client@user:echo#...

  client:c5#subject@user:echo#...
  client:c5#advisor@user:sierra#...
  client:c5#org@organisation:org2#...

assertions:
  assertTrue:
    - client:c1#read@user:adam#...
    - client:c1#read@user:paul#...
    - client:c1#read@user:quentin#...
    - client:c1#read@user:darren#...

    - client:c2#subject@user:bob#...
    - client:c2#advisor@user:ray#...
    - client:c2#read@user:bob#...
    - client:c2#read@user:paul#...
    - client:c2#read@user:darren#...

    - client:c5#read@user:darren#...
    - client:c5#read@user:sierra#...
    - client:c5#read@user:echo#...

    - organisation:org1#write@user:darren#...
  assertFalse:
    - client:c1#read@user:ray#...
    - client:c2#read@user:quentin#...
    - organisation:org1#administrator@user:adam#...
    - organisation:org1#administrator@user:darren#...
    - organisation:org1#write@user:paul#...
    - client:c5#read@user:paul#...

validation:
# org 1:
  client:c1#read:
    - "[user:adam] is <client:c1#subject>"
    - "[user:darren] is <organisation:org1#owner>"
    - "[user:paul] is <organisation:org1#administrator>"
    - "[user:quentin] is <client:c1#advisor>"
  client:c1#write:
    - "[user:darren] is <organisation:org1#owner>"
    - "[user:paul] is <organisation:org1#administrator>"
    - "[user:quentin] is <client:c1#advisor>"

  client:c2#read:
    - "[user:bob] is <client:c2#subject>"
    - "[user:darren] is <organisation:org1#owner>"
    - "[user:paul] is <organisation:org1#administrator>"
    - "[user:ray] is <client:c2#advisor>"
  client:c2#write:
    - "[user:darren] is <organisation:org1#owner>"
    - "[user:paul] is <organisation:org1#administrator>"
    - "[user:ray] is <client:c2#advisor>"

  client:c3#read:
    - "[user:charlie] is <client:c3#subject>"
    - "[user:darren] is <organisation:org1#owner>"
    - "[user:paul] is <organisation:org1#administrator>/<client:c3#advisor>"
  client:c3#write:
    - "[user:darren] is <organisation:org1#owner>"
    - "[user:paul] is <organisation:org1#administrator>/<client:c3#advisor>"

  client:c4#read:
    - "[user:danny] is <client:c4#subject>"
    - "[user:darren] is <organisation:org1#owner>/<client:c4#advisor>"
    - "[user:paul] is <organisation:org1#administrator>"
  client:c4#write:
    - "[user:darren] is <organisation:org1#owner>/<client:c4#advisor>"
    - "[user:paul] is <organisation:org1#administrator>"

# org 2:
  client:c5#read:
    - "[user:echo] is <client:c5#subject>"
    - "[user:darren] is <organisation:org2#owner>"
    - "[user:sierra] is <organisation:org2#administrator>/<client:c5#advisor>"
  client:c5#write:
    - "[user:darren] is <organisation:org2#owner>"
    - "[user:sierra] is <organisation:org2#administrator>/<client:c5#advisor>"

  organisation:org1#write:
    - "[user:darren] is <organisation:org1#owner>"
