apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod-issuer
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: cert-mgr@amplifa.co.uk
    privateKeySecretRef:
      name: letsencrypt-prod-privkey
    solvers:
    - http01:
        ingress:
          class: nginx
