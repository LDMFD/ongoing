apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod-issuer"
    kubernetes.io/ingress.class: "nginx"
spec:
  tls:
  - hosts:
    - do-api5.amplifa.co.uk
    secretName: api-tls
  rules:
    - host: do-api5.amplifa.co.uk
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ongoing-api
                port:
                  number: 8000
