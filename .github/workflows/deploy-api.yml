name: Deploy API Server

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        default: staging
        options:
          - staging
          - production

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Google Cloud Platform
      uses: google-github-actions/setup-gcloud@v0
      with:
        service_account_key: ${{ secrets.GCP_TF_STATE_SA_KEY }}
        project_id: ongoing-staging
        export_default_credentials: true

    - name: Setup GCP Credentials
      run: |
        echo '${{ secrets.GCP_TF_STATE_SA_KEY }}' > gcp-key.json
        echo "GOOGLE_APPLICATION_CREDENTIALS=${PWD}/gcp-key.json" >> $GITHUB_ENV

    - name: Configure gcloud for Terraform state access
      run: |
        gcloud auth configure-docker
        gcloud config set project ongoing-staging

    - name: Set up DigitalOcean Access
      run: echo "DIGITALOCEAN_ACCESS_TOKEN=${{ secrets.DO_PAT }}" >> $GITHUB_ENV

    - name: Install Terraform
      uses: hashicorp/setup-terraform@v1
      with:
        terraform_version: latest

    - name: Initialize Terraform
      run: cd Infra/Terraform && terraform init

    - name: Apply Terraform Configuration
      run: |
        cd Infra/Terraform
        terraform apply -auto-approve
      env:
        DIGITALOCEAN_TOKEN: ${{ secrets.DO_PAT }}
