name: Build API Server

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Build the API Server
      run: docker build ApiServer --file ApiServer/Dockerfile --build-arg RELEASE=${{ github.sha }}
